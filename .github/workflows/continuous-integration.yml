name: Continuous Integration

on:
  pull_request:
    branches:
      - develop

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-latest
    environment: Configuration Files
    steps:
      - uses: actions/checkout@v4

      # .mise.toml에 고정된 tuist 설치
      - uses: jdx/mise-action@v2

      # 러너 기본 Xcode(최신)에서는 고정된 realm-core가 컴파일되지 않아 로컬과 같은 26.1로 고정
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_26.1.app
          xcodebuild -version

      # 러너 이미지에는 기본 Xcode용 런타임만 있어, 고정한 Xcode에 맞는 iOS 시뮬레이터 런타임을 내려받는다
      - name: Download iOS simulator runtime
        run: sudo xcodebuild -downloadPlatform iOS

      - name: Create secret xcconfig files
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
        run: |
          mkdir -p EATSSU/App/Resources/Secrets
          for config in Release Debug; do
            {
              echo "BASE_URL = $BASE_URL"
              echo "KAKAO_API_KEY = $KAKAO_API_KEY"
            } > "EATSSU/App/Resources/Secrets/$config.xcconfig"
          done

      - name: Create GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > EATSSU/App/Resources/GoogleService-Info.plist

      - name: Install dependencies
        run: tuist install

      - name: Generate project
        run: tuist generate --no-open

      - name: Select or create simulator
        id: simulator
        run: |
          xcrun simctl list runtimes
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime in sorted(data, reverse=True):
              for device in data[runtime]:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      print(device["udid"]); sys.exit(0)
          ')
          if [ -z "$DEVICE_ID" ]; then
            echo "No available simulator, creating one"
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; rts=[r for r in json.load(sys.stdin)["runtimes"] if r["platform"]=="iOS" and r["isAvailable"]]; print(rts[-1]["identifier"])')
            DEVICE_ID=$(xcrun simctl create "ci-iphone" "iPhone 16" "$RUNTIME")
          fi
          echo "Using simulator $DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace EATSSU_WORKSPACE.xcworkspace \
            -scheme EATSSUUnitTests \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -100
